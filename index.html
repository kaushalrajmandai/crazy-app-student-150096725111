<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Particle Sandbox</title>
<style>
  *{margin:0;box-sizing:border-box}
  body{background:#05050a;overflow:hidden;font-family:'Courier New',monospace;color:#0ff}
  header{position:fixed;top:0;left:0;right:0;z-index:2;text-align:center;padding:14px;
    font-size:1.2rem;letter-spacing:3px;text-shadow:0 0 10px #0ff,0 0 25px #f0f;pointer-events:none}
  #hint{position:fixed;bottom:14px;width:100%;text-align:center;color:#f0f;opacity:.7;z-index:2;pointer-events:none;text-shadow:0 0 8px #f0f}
  canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<header id="hdr">Created by Student #STUDENT_NO</header>
<div id="hint">Move = trails · Click = shockwave · Hold = chaos · G = glitch · SPACE = gravity · K = signature</div>
<canvas id="c"></canvas>
<script>
const STUDENT_NO = "150096725111";
document.getElementById('hdr').textContent = 'Created by Student #' + STUDENT_NO;

const c = document.getElementById('c'), ctx = c.getContext('2d');
function resize(){ c.width = innerWidth; c.height = innerHeight; }
addEventListener('resize', resize); resize();

let particles = [], waves = [], hue = 0, mouse = {x:innerWidth/2, y:innerHeight/2, down:false};

// Audio (starts on first interaction)
let actx;
function beep(freq, dur, type='sawtooth', vol=0.08){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

// Keeps burst size safe: never negative, never NaN, never huge.
function clampCount(n){
  n = Number(n);
  if (!Number.isFinite(n) || n < 0) return 0;
  return Math.min(Math.floor(n), 300);
}

function burst(x, y, count){
  count = clampCount(count);
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, s = Math.random()*6+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,h:160+((hue+Math.random()*60)%160)});
  }
}

addEventListener('mousemove', e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  burst(mouse.x, mouse.y, 3);
  if(Math.random()<.08) beep(300+Math.random()*600, .06, 'square', .03);
});
addEventListener('mousedown', e=>{
  mouse.down=true;
  waves.push({x:e.clientX,y:e.clientY,r:0,h:hue});
  burst(e.clientX,e.clientY,120);
  beep(110,.4,'sawtooth',.12); beep(880,.15,'square',.05);
});
addEventListener('mouseup', ()=>mouse.down=false);
let gravity = false;
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); gravity=!gravity; beep(gravity?200:600,.2,'triangle',.1); }
  if(e.key.toLowerCase()==='k'){ // signature move: KAUSHAL letter rain
    "KAUSHAL".split('').forEach((ch,i)=>setTimeout(()=>{
      const x=innerWidth/2+(i-3)*60, y=innerHeight/2;
      burst(x,y,60); beep(300+i*80,.12,'square',.06);
      ctx.save(); ctx.font='bold 60px Courier New'; ctx.fillStyle='#0ff';
      ctx.shadowBlur=30; ctx.shadowColor='#f0f'; ctx.fillText(ch,x-18,y+20); ctx.restore();
    }, i*120));
  }
  if(e.key.toLowerCase()==='g'){
    document.body.style.filter='hue-rotate(180deg) contrast(1.6)';
    for(let i=0;i<6;i++) setTimeout(()=>beep(100+Math.random()*1500,.05,'square',.08), i*40);
    setTimeout(()=>document.body.style.filter='',250);
  }
});

// Analogy: This loop is like a lifeguard who looks at the pool 60 times a second:
// every glowing particle is a swimmer who drifts, slows down, and fades away,
// while the lifeguard adds new swimmers wherever you click.
function loop(){
  ctx.fillStyle='rgba(5,5,10,0.22)';
  ctx.fillRect(0,0,c.width,c.height);
  hue=(hue+1)%360;
  if(mouse.down) burst(mouse.x,mouse.y,8);

  ctx.globalCompositeOperation='lighter';
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(gravity) p.vy+=0.15;
    p.x+=p.vx; p.y+=p.vy; p.vx*=.98; p.vy*=.98; p.life-=.015;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.fillStyle=`hsla(${p.h},100%,60%,${p.life})`;
    ctx.shadowBlur=15; ctx.shadowColor=`hsl(${p.h},100%,60%)`;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.5*p.life+.5,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i]; w.r+=10;
    if(w.r>Math.hypot(c.width,c.height)){waves.splice(i,1);continue;}
    ctx.strokeStyle=`hsla(${w.h},100%,60%,${Math.max(0,1-w.r/900)})`;
    ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  if(particles.length>3000) particles.splice(0,particles.length-3000);
  requestAnimationFrame(loop);
}
loop();

// Unit tests
console.assert(clampCount(50) === 50, "normal value failed");
console.assert(clampCount(0) === 0, "zero input failed");
console.assert(clampCount(-10) === 0, "negative input failed");
</script>
</body>
</html>
